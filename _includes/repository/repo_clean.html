{% assign repo_url = include.repository | split: '/' %}
{% assign repo_name = repo_url[1] | replace: '_', ' ' | replace: '-', ' ' | split: ' ' | join: ' ' %}

<div class="project-card">
  <a href="https://github.com/{{ include.repository }}" target="_blank" class="project-link">
    <div class="project-content">
      <h3 class="project-title">{{ repo_name }}</h3>
      <p class="project-path">{{ repo_url[0] }}/{{ repo_url[1] }}</p>
    </div>
    <div class="project-arrow">→</div>
  </a>
</div>
