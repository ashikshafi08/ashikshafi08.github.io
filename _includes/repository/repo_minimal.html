{% assign repo_url = include.repository | split: '/' %}
{% assign repo_name = repo_url[1] | replace: '_', ' ' | replace: '-', ' ' | split: ' ' | join: ' ' %}

<div class="minimal-repo-card">
  <a href="https://github.com/{{ include.repository }}" target="_blank" class="repo-link">
    <div class="repo-header">
      <h3 class="repo-title">{{ repo_name }}</h3>
    </div>
    <div class="repo-description">
      <span class="repo-lang">{{ repo_url[0] }}/{{ repo_url[1] }}</span>
    </div>
    <svg class="external-icon" viewBox="0 0 24 24" width="18" height="18">
      <path fill="currentColor" d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
    </svg>
  </a>
</div>
